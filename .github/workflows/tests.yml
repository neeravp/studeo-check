name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image for this manual run (pushes always use ubuntu-24.04)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-latest

jobs:
  quality:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: vendor/bin/pint --test

      - run: vendor/bin/pest

      - run: vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress

      - run: sh spec/replay.sh
